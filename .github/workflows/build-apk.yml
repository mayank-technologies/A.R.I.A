name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 || true)
          echo "$JAVA_VERSION_OUTPUT"
          if [ -z "$JAVA_VERSION_OUTPUT" ]; then
            echo "Error: Could not detect Java installation."
            exit 1
          fi

          RAW_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Could not parse Java version from java -version output."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{ if ($1 == "1") print $2; else print $1 }')
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect numeric Java major version (parsed '$RAW_VERSION')."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is $MAJOR_VERSION, but Java 17 or newer is required."
            exit 1
          fi

      # Fix: android-actions/setup-android@v3 defaults to `packages: 'tools platform-tools'`.
      # Google removed the legacy `tools` package, which makes cmdline-tools/16.0/bin/sdkmanager fail with exit code 1.
      # Passing `packages: ''` skips that broken default while keeping ANDROID_HOME / PATH setup intact.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        timeout-minutes: 10
        with:
          packages: ''

      # Accept SDK licenses and install verified API 36.1 / 36 / build-tools 36.0.0 with --verbose logging & retry logic
      - name: Install Android SDK packages and accept licenses
        timeout-minutes: 10
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK_ROOT: $SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"

          # Pre-seed standard & preview license hashes so headless Gradle/sdkmanager never prompts interactively
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$SDK_ROOT/licenses/android-sdk-preview-license"

          SDKMANAGER_BIN=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER_BIN" ] || [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "Error: sdkmanager binary not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER_BIN"

          # Disable pipefail locally so `yes` closing on SIGPIPE doesn't abort the step
          set +o pipefail
          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses --verbose || true

          # Install exact packages matching app/build.gradle.kts (compileSdk 36 minorApiLevel 1) with 3x retry
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Installing Android SDK packages (--verbose)..."
            if "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --verbose \
              "platform-tools" \
              "build-tools;36.0.0" \
              "platforms;android-36" \
              "platforms;android-36.1"; then
              SUCCESS=true
              break
            fi
            echo "Warning: sdkmanager failed on attempt $ATTEMPT. Retrying in 10s..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Error: sdkmanager failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          ls -la "$SDK_ROOT/platforms" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug.keystore already exists."
          else
            KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN=$(command -v keytool || true)
            fi
            if [ -z "$KEYTOOL_BIN" ]; then
              echo "Error: keytool not found in configured Java installation."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore was not created."
            exit 1
          fi
          echo "Verified ./debug.keystore exists."

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          TARGET_ASSET="$TEMP_DIR/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$TARGET_ASSET"

          if [ ! -f "$TARGET_ASSET" ] || [ ! -s "$TARGET_ASSET" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          echo "asset_path=$TARGET_ASSET" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: app-debug.apk"

      - name: Delete previous debug APK releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --limit 1000 --json tagName -q '.[].tagName | select(startswith("debug-apk-build-"))' || true)
          if [ -z "$OLD_TAGS" ]; then
            echo "No previous debug-apk-build-* releases found."
            exit 0
          fi

          echo "$OLD_TAGS" | while IFS= read -r OLD_TAG; do
            if [ -n "$OLD_TAG" ]; then
              echo "Deleting previous release: $OLD_TAG"
              gh release delete "$OLD_TAG" --yes || echo "Warning: Could not delete release $OLD_TAG"
              git push --delete origin "$OLD_TAG" || echo "Warning: Could not delete remote tag $OLD_TAG"
            fi
          done

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared APK release asset does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared release asset does not end in .apk."
              exit 1
              ;;
          esac

          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "The APK was built by GitHub Actions." \
            "" \
            "- GitHub Actions Run Number: ${{ github.run_number }}" \
            "- GitHub Actions Run Attempt: ${{ github.run_attempt }}" \
            "- Source Commit SHA: ${{ github.sha }}" \
            "" \
            "Notes:" \
            "- This APK is intended for testing." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a temporary debug keystore.")

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            gh release view "$TAG"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_APK_URL"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_APK_URL"
              echo ""
              echo "- **Release Tag**: \`$TAG\`"
              echo "- **Release Title**: $TITLE"
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Filename**: \`app-debug.apk\`"
              echo "- **Backup Artifact**: The normal Actions artifact \`app-debug-apk\` remains available on this run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            if [ "${{ steps.upload_apk.outcome }}" = "success" ]; then
              echo "The debug APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available."
              {
                echo "### Debug APK Build Succeeded (Release Publishing Failed)"
                echo ""
                echo "The debug APK build succeeded, and the normal Actions artifact \`app-debug-apk\` remains available as a backup. The direct latest-release link was not updated for this run."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The APK build or upload did not complete successfully."
              {
                echo "### Debug APK Build Failed"
                echo ""
                echo "The debug APK build did not succeed, so no release was published."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
