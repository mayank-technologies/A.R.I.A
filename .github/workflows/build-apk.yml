name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          echo "$JAVA_VERSION_OUTPUT"
          MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 21 ]; then
            echo "Error: Java major version is $MAJOR_VERSION, but 21 or newer is required for AGP 9 / SDK 36."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36 components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: $SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"

          # Pre-seed standard Android SDK & preview license hashes so Gradle never blocks on prompts
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$SDK_ROOT/licenses/android-sdk-preview-license"

          SDKMANAGER_BIN=$(command -v sdkmanager || find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER_BIN" ] && [ -x "$SDKMANAGER_BIN" ]; then
            echo "Found sdkmanager: $SDKMANAGER_BIN"
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
          else
            echo "::warning::sdkmanager not found; relying on pre-seeded licenses and Gradle SDK auto-download."
          fi

          ls -la "$SDK_ROOT/platforms" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f "./debug.keystore" ] && [ -s "./debug.keystore.base64" ]; then
            echo "Decoding repository debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore || rm -f ./debug.keystore
          fi

          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore failed to create."
            exit 1
          fi
          echo "debug.keystore exists and verified."

      - name: Generate .env for Secrets Gradle Plugin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          sanitize() { printf '%s' "$1" | tr -d '\r\n'; }
          {
            printf 'GEMINI_API_KEY=%s\n' "$(sanitize "${GEMINI_API_KEY:-your_key_here}")"
            printf 'ELEVENLABS_API_KEY=%s\n' "$(sanitize "${ELEVENLABS_API_KEY:-your_key_here}")"
            printf 'ELEVENLABS_VOICE_ID=%s\n' "$(sanitize "${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}")"
            printf 'ANTHROPIC_API_KEY=%s\n' "$(sanitize "${ANTHROPIC_API_KEY:-your_key_here}")"
          } > .env
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            echo "YOUTUBE_API_KEY=$(sanitize "$YOUTUBE_API_KEY")" >> "$GITHUB_ENV"
          fi
          echo ".env file generated for BuildConfig injection (values redacted)."

      - name: Run unit tests
        run: >
          gradle :app:testDebugUnitTest
          --stacktrace
          --no-daemon
          --max-workers=2
          --no-configuration-cache
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build debug APK
        run: >
          gradle :app:assembleDebug
          --stacktrace
          --no-daemon
          --max-workers=2
          --no-configuration-cache
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK does not exist!"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: Selected file extension is not .apk"
              exit 1
              ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | cut -d'/' -f2 | sed 's/[^a-zA-Z0-9._-]/_/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          TEMP_DIR=$(mktemp -d)

          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/$ASSET_NAME"

          if [ ! -s "$TEMP_DIR/$ASSET_NAME" ]; then
            echo "Error: Copied release asset is missing or empty."
            exit 1
          fi

          echo "asset_path=$TEMP_DIR/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset is not an .apk file"
              exit 1
              ;;
          esac

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "The APK was built by GitHub Actions." \
            "" \
            "- GitHub Actions Run Number: ${{ github.run_number }}" \
            "- GitHub Actions Run Attempt: ${{ github.run_attempt }}" \
            "- Source Commit SHA: ${{ github.sha }}" \
            "" \
            "Note:" \
            "- This APK is intended for testing." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a debug keystore.")

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            printf '%s\n' \
              "### Debug APK Build & Release Succeeded" \
              "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)" \
              "- **APK Filename**: \`$ASSET_NAME\`" \
              "- **Tag**: \`$TAG\`" \
              "" \
              "You can download the APK directly from the **Assets** section of the release page above." \
              "" \
              "*Backup Artifact*: The normal Actions artifact \`app-debug-apk\` is also available on this run page." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The APK build succeeded and the artifact 'app-debug-apk' remains available for download."

            printf '%s\n' \
              "### Debug APK Build Succeeded (Release Publishing Skipped)" \
              "The debug APK was built successfully, but publishing to GitHub Releases encountered an issue or was skipped." \
              "" \
              "- **Artifact Name**: \`app-debug-apk\`" \
              "- **File**: \`app-debug.apk\`" \
              "" \
              "You can download the built APK directly from the **Artifacts** section at the bottom of this GitHub Actions run summary page." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
