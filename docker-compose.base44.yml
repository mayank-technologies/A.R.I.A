services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
    command: ["python3", "/app/scripts/base44_server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure

volumes:
  gradle-cache:
